[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii_detection"
version = "0.1.0"

authors = [
    {name = "Aissata Kane", email = "aissata.kane@tum.de"},
    {name = "Sonja Hamm", email = "sonja.hamm@tum.de"},
    {name = "Max Seidlitz", email = "max.seidlitz@tum.de"},
]

description = "Personal Data Detection"
requires-python = ">=3.10"

dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}